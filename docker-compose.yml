services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: stanza
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  ml-engine:
    build: ./ml-engine
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ""
      DB_NAME: stanza
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ml_index:/app/data

  backend-php:
    build: ./backend-php
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_NAME: stanza
      DB_USER: root
      DB_PASSWORD: ""
      ML_ENGINE_URL: http://ml-engine:8000
      APP_DEBUG: "true"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  mysql_data:
  ml_index:
